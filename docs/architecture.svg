<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="980" height="340" rx="18" fill="url(#bg)"/>
  <text x="36" y="48" fill="#f8fafc" font-size="26" font-weight="700">Multimodal RAG System</text>
  <text x="36" y="72" fill="#94a3b8" font-size="14">PDF • DOCX • TXT • MD • Images  →  CLIP embeddings  →  ChromaDB  →  LLM answer + citations</text>
  <!-- boxes -->
  <g font-size="13" font-weight="600">
    <rect x="36" y="110" width="150" height="90" rx="12" fill="#0ea5e9" opacity="0.9"/>
    <text x="52" y="138" fill="#fff">📄 Upload</text>
    <text x="52" y="158" fill="#e0f2fe" font-size="11" font-weight="400">Drag &amp; drop</text>
    <text x="52" y="174" fill="#e0f2fe" font-size="11" font-weight="400">OCR + extract</text>
    <rect x="206" y="110" width="150" height="90" rx="12" fill="#6366f1" opacity="0.95"/>
    <text x="222" y="138" fill="#fff">✂️ Chunk</text>
    <text x="222" y="158" fill="#e0e7ff" font-size="11" font-weight="400">512 chars</text>
    <text x="222" y="174" fill="#e0e7ff" font-size="11" font-weight="400">overlap 50</text>
    <rect x="376" y="110" width="150" height="90" rx="12" fill="#8b5cf6" opacity="0.95"/>
    <text x="392" y="138" fill="#fff">🧠 Embed</text>
    <text x="392" y="158" fill="#ede9fe" font-size="11" font-weight="400">CLIP ViT-B-32</text>
    <text x="392" y="174" fill="#ede9fe" font-size="11" font-weight="400">text + image</text>
    <rect x="546" y="110" width="150" height="90" rx="12" fill="#10b981" opacity="0.95"/>
    <text x="562" y="138" fill="#fff">🗄️ Search</text>
    <text x="562" y="158" fill="#d1fae5" font-size="11" font-weight="400">ChromaDB</text>
    <text x="562" y="174" fill="#d1fae5" font-size="11" font-weight="400">cosine top-K</text>
    <rect x="716" y="110" width="150" height="90" rx="12" fill="#f59e0b" opacity="0.95"/>
    <text x="732" y="138" fill="#fff">💬 Answer</text>
    <text x="732" y="158" fill="#fef3c7" font-size="11" font-weight="400">LongCat LLM</text>
    <text x="732" y="174" fill="#fef3c7" font-size="11" font-weight="400">+ citations</text>
  </g>
  <!-- arrows -->
  <g fill="#64748b" font-size="20">
    <text x="188" y="160">›</text><text x="358" y="160">›</text><text x="528" y="160">›</text><text x="698" y="160">›</text>
  </g>
  <!-- query bar -->
  <rect x="36" y="228" width="830" height="64" rx="12" fill="#020617" stroke="#334155"/>
  <text x="58" y="255" fill="#e2e8f0" font-size="14">❓ “What are the key technologies in multimodal AI?”  →  5 sources  •  0.75s  •  CLIP + VLMs + embeddings</text>
  <text x="58" y="276" fill="#64748b" font-size="12">Try: test_document.txt included • POST /api/upload • POST /api/query • GET /api/stats</text>
  <rect x="876" y="228" width="68" height="64" rx="12" fill="url(#card)"/>
  <text x="892" y="266" fill="#fff" font-size="20">▶</text>
</svg>
